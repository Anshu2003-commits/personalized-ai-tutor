[project]
name = "onlearn-llm-app"
version = "0.1.0"
description = "Onlearn Python agent service"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "openai>=2.0.0",
    "pydantic>=2.8.0",
    "uvicorn[standard]>=0.35.0",
]

[tool.ruff]
line-length = 88

[tool.black]
line-length = 88

[tool.setuptools.packages.find]
include = ["api*", "app*"]
