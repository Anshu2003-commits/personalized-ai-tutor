services:
  llm-app:
    image: onlearn-asxix-llm-app:latest
    restart: unless-stopped
    env_file:
      - path: ./llm-app/.env
        required: true
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/data:ro
      - llm-app-data:/llm-app/.data
    environment:
      COURSE_DATA_PATH: /data/courses
      HISTORY_DB_PATH: /llm-app/.data/tutor_history.sqlite3
      MEMORY_DB_PATH: /llm-app/.data/tutor_memory.sqlite3
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - app-network

  web-app:
    image: onlearn-asxix-web-app:latest
    restart: unless-stopped
    env_file:
      - path: ./web-app/.env.asxix
        required: true
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/app/data:ro
      - ./projects:/app/projects:ro
    environment:
      LLM_APP_URL: http://llm-app:8000
      NODE_OPTIONS: "--dns-result-order=ipv4first"
    depends_on:
      llm-app:
        condition: service_healthy
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  llm-app-data:
