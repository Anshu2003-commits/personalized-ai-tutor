name: CI

on:
  pull_request:
    branches:
      - staging
      - production
  push:
    branches:
      - staging
      - production
  workflow_dispatch:

jobs:
  web-app:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Set up Python for verifier scripts
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify code runner source assets
        run: |
          npm run verify:python-source
          npm run verify:boilerplate

  llm-app:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -e ./llm-app

      - name: Run tests
        env:
          PYTHONPATH: llm-app
        run: python -m unittest discover -s llm-app/tests
